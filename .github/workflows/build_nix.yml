name: "Build legacy Nix package on Ubuntu"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  registry: ghcr.io/2143-labs
  rsrepo: openfrontpro-rs
  simrepo: openfrontpro-sim

jobs:
  build_rs:
    runs-on: [self-hosted, nixos]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix Cache
        uses: cachix/cachix-action@v10
        with:
          name: john2143
          authToken: ${{ secrets.CACHIX_TOKEN }}
          github_access_token: ${{ secrets.PAT_PACKAGES }}

      - name: Building package
        run: |
          nix build .#container

      - name: Push with skopeo
        run: |
          skopeo login --username ${{ github.actor }} --password "${{ secrets.PAT_PACKAGES }}" ghcr.io
          ls -la ./result
          RESULT=$(readlink -f ./result)
          echo "Result path: $RESULT"
          IMAGE_TAG=$(date +%Y%m%d_%H%M)
          skopeo copy docker-archive://$RESULT docker://${{ env.registry }}/${{ env.rsrepo }}:openfrontpro-${IMAGE_TAG}
          # if not pull request, then also push as latest
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            skopeo copy docker-archive://$RESULT docker://${{ env.registry }}/${{ env.rsrepo }}:openfrontpro-branch-${{ github.head_ref }}
          else
            skopeo copy docker-archive://$RESULT docker://${{ env.registry }}/${{ env.rsrepo }}:openfrontpro-latest
          fi

  build_sim:
    runs-on: [self-hosted, nixos]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix Cache
        uses: cachix/cachix-action@v10
        with:
          name: john2143
          authToken: ${{ secrets.CACHIX_TOKEN }}
          github_access_token: ${{ secrets.PAT_PACKAGES }}

      - name: Building sim package
        run: |
          nix build .#container-sim

      - name: Push sim with skopeo
        run: |
          skopeo login --username ${{ github.actor }} --password "${{ secrets.PAT_PACKAGES }}" ghcr.io
          ls -la ./result
          RESULT=$(readlink -f ./result)
          echo "Result path: $RESULT"
          IMAGE_TAG=$(date +%Y%m%d_%H%M)
          skopeo copy docker-archive://$RESULT docker://${{ env.registry }}/${{ env.simrepo }}:openfrontpro-${IMAGE_TAG}
          # if not pull request, then also push as latest
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            skopeo copy docker-archive://$RESULT docker://${{ env.registry }}/${{ env.simrepo }}:openfrontpro-branch-${{ github.head_ref }}
          else
            skopeo copy docker-archive://$RESULT docker://${{ env.registry }}/${{ env.simrepo }}:openfrontpro-latest
          fi

